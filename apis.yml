aid: onsi
name: Onsi
description: >-
  Onsi is a global technology provider and UK/EU insurance intermediary that
  delivers flexible, shift-linked worker benefits — on-demand ("Embedded") pay,
  insurance cover, and a rewards marketplace — to employers and their frontline
  workers. Its Partner (BMO) API lets benefit-program partners manage members
  (invite, read, update, replace, and offboard individually, in batches, or via
  full-list CSV jobs), read tiers and earned-wage balances, run on-demand pay
  withdrawals through a two-step intent/complete flow, and reconcile pay cycles
  and deductions with payroll. Authentication is an x-api-key header; requests
  support idempotency (x-idempotency-key, 7-day retention) and skip/take offset
  pagination, with a consistent code/message error envelope.
