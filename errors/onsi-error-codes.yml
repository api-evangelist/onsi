method: searched
source: https://docs.onsi.com/api-reference/error-handling
format: custom-json
envelope:
  description: >-
    The Onsi API returns a consistent JSON error structure. Validation errors
    return an `issues` array (each issue has `code`, `message`, and `path`).
    Other errors return a top-level object with `code`, `message`, and any
    error-specific fields. Always branch on `code`, not `message`.
  discriminator: code
  example:
    issues:
      - code: HeaderValidation
        message: Required
        path: x-api-key
      - code: BodyValidation
        message: Required
        path: currency
errors:
  # --- Generic ---
  - code: InternalServerError
    category: generic
    http_status: 500
    meaning: An unexpected error occurred.
    action: Retry with backoff; contact support if it persists.
  - code: BadRequest
    category: generic
    http_status: 400
    meaning: >-
      The request is malformed or invalid and no more specific error code
      applies.
    action: Correct the request per the message and retry.
  - code: Forbidden
    category: generic
    http_status: 403
    meaning: The caller is not allowed to perform the requested action.
    action: Verify API-key permissions.
  - code: NotFound
    category: generic
    http_status: 404
    meaning: The requested resource does not exist.
    action: Verify the resource identifier.
  - code: Conflict
    category: generic
    http_status: 409
    meaning: The request conflicts with the current state of the server.
    action: Re-fetch state and reconcile before retrying.
  - code: RateLimitExceeded
    category: generic
    http_status: 429
    meaning: The request was rate limited (>100 rps per client).
    action: Implement exponential backoff and reduce request frequency.
  - code: UnprocessableEntity
    category: generic
    http_status: 422
    meaning: >-
      The request is valid but cannot be processed due to business logic or
      other constraints.
    action: Inspect the message for the constraint that failed.
  # --- Request validation ---
  - code: BodyValidation
    category: validation
    fields: [code, message, path]
    meaning: An error occurred while validating the request body.
  - code: QueryValidation
