    fields: [code, message, path]
    meaning: An error occurred while validating the request query parameters.
  - code: PathValidation
    category: validation
    fields: [code, message, path]
    meaning: An error occurred while validating the request path parameters.
  - code: HeaderValidation
    category: validation
    fields: [code, message, path]
    meaning: An error occurred while validating the request headers.
  # --- Specific ---
  - code: MemberNotFound
