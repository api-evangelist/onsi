  /v1/pay/cycles:
    get:
      description: Search pay cycles, returns the latest pay cycle first
      summary: Search pay cycles
      tags:
      - pay
      parameters:
      - name: statuses
        in: query
        description: Filter by status
        schema:
          type: array
          items:
            type: string
            enum:
            - Open
            - Closed
      - name: skip
        in: query
        required: true
        schema:
          default: 0
          type: number
      - name: take
        in: query
        required: true
        schema:
          default: 50
          type: number
      operationId: getPayCycles
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  payCycles:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayCycle'
                  total:
                    example: 1
                    type: number
                  skip:
                    example: 0
                    type: number
                  take:
                    example: 50
                    type: number
                required:
                - payCycles
                - total
                - skip
                - take
                additionalProperties: false
  /v1/pay/cycles/{id}:
    get:
      summary: Show pay cycle
      tags:
      - pay
      parameters:
      - name: id
        in: path
        description: The unique identifier for a PayCycle, prefixed with pc_
        required: true
        schema:
          example: pc_<id>
          type: string
      operationId: getPayCycle
      responses:
        '200':
          description: A pay cycle is a period of time pay is made available for members to withdraw
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayCycle'
  /v1/pay/cycles/{id}/deductions:
    get:
      summary: Show pay cycle summary
      tags:
      - pay
      parameters:
      - name: id
        in: path
        description: The unique identifier for a PayCycle, prefixed with pc_
        required: true
        schema:
          example: pc_<id>
          type: string
      - name: skip
        in: query
        required: true
        schema:
          default: 0
          type: number
      - name: take
        in: query
        required: true
        schema:
          default: 50
          type: number
      operationId: getPayCycleDeductions
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  deductions:
                    type: array
                    items:
                      type: object
                      properties:
                        memberId:
                          example: mem_<id>
                          description: The unique identifier for a Member, prefixed with mem_
                          type: string
                        total:
                          $ref: '#/components/schemas/Total'
                      required:
                      - memberId
                      - total
                      additionalProperties: false
                  total:
                    example: 1
                    type: number
                  skip:
                    example: 0
                    type: number
                  take:
                    example: 50
                    type: number
                required:
                - deductions
                - total
                - skip
                - take
                additionalProperties: false
  /v1/pay/withdrawals:
    get:
      summary: Show withdrawals for the pay cycle
      tags:
      - pay
      parameters:
      - name: payCycleId
        in: query
        description: Filter by pay cycle
        schema:
          example: pc_<id>
          type: string
      - name: memberId
        in: query
        description: Filter by member
        schema:
          example: mem_<id>
          type: string
      - name: skip
        in: query
        required: true
        schema:
          default: 0
          type: number
      - name: take
        in: query
        required: true
        schema:
          default: 50
          type: number
      - name: fromDate
        in: query
        description: Start the results after this date
        schema:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      - name: toDate
        in: query
        description: End the results before this date
        schema:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      operationId: getWithdrawals
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  withdrawals:
                    type: array
                    items:
                      $ref: '#/components/schemas/Withdrawal'
                  hasMore:
                    example: false
                    description: Whether there are more results to fetch
                    type: boolean
                  skip:
                    example: 0
                    type: number
                  take:
                    example: 50
                    type: number
                required:
                - withdrawals
                - hasMore
                - skip
                - take
                additionalProperties: false
