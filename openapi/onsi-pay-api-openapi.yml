  /v1/pay/withdrawals/complete:
    post:
      summary: Finalize a withdrawal
      tags:
      - pay
      parameters:
      - name: x-idempotency-key
        in: header
        description: Unique key to ensure idempotency of the request
        schema:
          type: string
      operationId: completeWithdrawal
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                withdrawalIntentId:
                  example: wi_<id>
                  description: The unique identifier for a PayWithdrawalIntent, prefixed with wi_
                  type: string
              required:
              - withdrawalIntentId
              additionalProperties: false
      responses:
        '201':
          description: '201'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
                additionalProperties: false
  /v1/pay/members/{memberId}/withdrawals:
    get:
      summary: Show withdrawals for the member
      deprecated: true
      tags:
      - pay
      parameters:
      - name: memberId
        in: path
        description: The unique identifier for a Member, prefixed with mem_
        required: true
        schema:
          example: mem_<id>
          type: string
      - name: skip
        in: query
        required: true
        schema:
          default: 0
          type: number
      - name: take
        in: query
        required: true
        schema:
          default: 50
          type: number
      operationId: getMemberWithdrawals
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  withdrawals:
                    type: array
                    items:
                      type: object
                      properties:
                        amount:
                          $ref: '#/components/schemas/Money'
                        fee:
                          $ref: '#/components/schemas/Money'
                        payCycleId:
                          example: pc_<id>
                          description: The unique identifier for a PayCycle, prefixed with pc_
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                      required:
                      - amount
                      - fee
                      - payCycleId
                      - createdAt
                      additionalProperties: false
                  skip:
                    example: 0
                    type: number
                  take:
                    example: 50
                    type: number
                  total:
                    example: 1
                    type: number
                required:
                - withdrawals
                - skip
                - take
                - total
                additionalProperties: false
  /v1/pay/run:
